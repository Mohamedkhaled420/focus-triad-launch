<html lang="en"><head><meta charset="utf-8">

<title>Dayflow</title>
<style>
:root{box-sizing:border-box;--bg:#fbf7f0;--glass:rgba(255,255,255,.72);--ink:#1d1d1f;--mute:#6e6e73;--line:rgba(60,40,30,.1);--chipc:rgba(120,100,90,.12)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#st{position:fixed;left:0;right:0;top:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));transition:bottom .55s cubic-bezier(.32,.72,0,1)}
body.full #st{bottom:0}
.pane{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;transform:scale(.985);transition:opacity .35s,transform .5s cubic-bezier(.32,.72,0,1)}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));--c:#0a84ff;transition:transform .55s cubic-bezier(.32,.72,0,1)}

.hl{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:27px;background:color-mix(in srgb,var(--c) 15%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 28%,transparent);transform:translateX(calc(var(--i,0)*100%));transition:transform .6s cubic-bezier(.34,1.5,.5,1),background .4s}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--mute);transition:color .3s,transform .35s cubic-bezier(.34,1.6,.5,1)}

.tab.on{color:var(--c)}.tab.on svg{transform:translateY(-1px) scale(1.1)}.tab:active{transform:scale(.9)}
.dot{position:absolute;top:9px;left:calc(50% + 6px);width:9px;height:9px;border-radius:50%;background:#f0518f;box-shadow:0 0 0 2px var(--bg);animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{scale:1.3}}

#plus:active{transform:scale(.9)}#plus svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;transition:transform .5s cubic-bezier(.34,1.6,.5,1)}#plus.x svg{transform:rotate(135deg)}
#menu{position:fixed;right:16px;bottom:calc(14px + 58px + 12px + env(safe-area-inset-bottom,0px));z-index:11;min-width:210px;padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(30px) saturate(1.8);-webkit-backdrop-filter:blur(30px) saturate(1.8);box-shadow:0 20px 50px -16px rgba(0,0,0,.4),inset 0 0 0 1px var(--line);transform-origin:bottom right;opacity:0;transform:translateY(14px) scale(.9);pointer-events:none;transition:opacity .25s,transform .5s cubic-bezier(.34,1.5,.5,1)}
#menu.on{opacity:1;transform:none;pointer-events:auto}
#menu button{display:flex;align-items:center;gap:12px;width:100%;height:54px;padding:0 12px;border-radius:20px;font-size:16px;font-weight:600;text-align:left;transition:background .2s,transform .2s}#menu button:active{background:var(--chipc);transform:scale(.97)}
#menu i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k)}#menu svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#menu.on button{animation:mi .45s cubic-bezier(.34,1.5,.5,1) backwards}#menu.on button:nth-child(2){animation-delay:.05s}#menu.on button:nth-child(1){animation-delay:.1s}@keyframes mi{from{opacity:0;transform:translateY(10px)}}
#hab{overflow-y:auto;overscroll-behavior:contain;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 30px}

.hw.enter>*{animation:hin .65s cubic-bezier(.32,.72,0,1) backwards;animation-delay:calc(var(--i,0)*70ms)}@keyframes hin{from{opacity:0;transform:translateY(20px) scale(.98);filter:blur(6px)}}
.ht .s{color:var(--mute);font-size:15px}.ht h1{margin:0;font-size:34px;letter-spacing:-.035em;line-height:1.1}
.hc{background:var(--glass);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 16px 40px -22px rgba(0,0,0,.3),inset 0 0 0 1px var(--line);border-radius:30px}
.hero{display:flex;align-items:center;gap:18px;padding:20px}.hs h2{margin:0 0 10px;font-size:20px;letter-spacing:-.02em;line-height:1.2}
.fl{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;background:rgba(255,149,0,.14);color:#ff9500;font-size:13px;font-weight:700}.fl svg,.hm svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big-r{position:relative;width:124px;height:124px;flex:none}.big-r b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-size:30px;letter-spacing:-.03em;line-height:1}.big-r small{display:block;font-size:12px;color:var(--mute);font-weight:600;letter-spacing:0;margin-top:3px}
.hlb{margin:10px 4px 0;font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.hlist{display:flex;flex-direction:column;gap:10px}
.hr{padding:12px 14px;border-radius:28px}.hrm{display:flex;align-items:center;gap:14px}
.ck{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 2.5px color-mix(in srgb,var(--c) 45%,transparent);transition:background .3s,box-shadow .3s,transform .35s cubic-bezier(.34,1.6,.5,1)}
.ck svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .4s .08s}
.ck.on{background:var(--c);box-shadow:0 10px 22px -8px var(--c)}.ck.on svg{stroke-dashoffset:0}.ck:active{transform:scale(.88)}.ck.pop{animation:pk .55s cubic-bezier(.34,1.6,.5,1)}@keyframes pk{40%{transform:scale(1.18)}}
.hm{flex:1;min-width:0;text-align:left;padding:4px 0}.hm b{display:block;font-size:17px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hm span{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--mute)}.hm span.hot{color:#ff9500}
.wn{margin:0;padding-top:14px;font-size:13px;color:var(--mute)}
.wk{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px}.wk button{display:flex;flex-direction:column;align-items:center;gap:5px;width:44px;font-size:11px;font-weight:700;color:var(--mute)}
.wk i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;background:var(--chipc);color:var(--ink);transition:background .3s,transform .35s cubic-bezier(.34,1.6,.5,1)}.wk button:active i{transform:scale(.88)}.wk .on i{background:var(--c);color:#fff}
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.32,.72,0,1)}.ex .xp{grid-template-rows:1fr}.xp>div{overflow:hidden}
.del{display:block;margin:10px auto 2px;padding:10px 16px;color:#ff453a;font-weight:600;font-size:14px}
.addb{height:54px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line);transition:transform .3s cubic-bezier(.34,1.6,.5,1)}.addb:active{transform:scale(.97)}
.ap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.32,.72,0,1)}.ap.on{grid-template-rows:1fr}.ap>div{overflow:hidden}
.ai{display:flex;gap:8px;padding-top:2px}.ai input{flex:1;min-width:0;height:50px;padding:0 18px;border:0;border-radius:99px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-size:16px;font-family:inherit;outline:0}.ai input:focus{box-shadow:inset 0 0 0 2px #34c759}.ai button{padding:0 22px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600}
.sgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.sgs button{padding:11px 16px;border-radius:99px;background:var(--chipc);font-weight:600;font-size:14px;transition:transform .3s cubic-bezier(.34,1.6,.5,1)}.sgs button:active{transform:scale(.92)}
/* ---- habits v2: editorial type, tick dial, seals ---- */
.hs h2,.big-r b,.sb strong,.sc2 h3{font-weight:700}
.hs h2{font-size:20px;letter-spacing:-.02em}
.hero{flex-direction:column;align-items:stretch;gap:18px}.hr1{display:flex;align-items:center;gap:18px}
.tk{position:absolute;inset:0;width:100%;height:100%}.tk line{stroke:var(--chipc);stroke-width:3.2;stroke-linecap:round;transition:stroke .35s}.tk line.on{stroke:#34c759}
.wkd{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-top:14px;border-top:1px dashed var(--line)}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--mute)}.wd.fu{opacity:.4}
.wd i{width:30px;height:30px;border-radius:50%;background:conic-gradient(#34c759 calc(var(--f)*360deg),var(--chipc) 0);-webkit-mask:radial-gradient(circle,transparent 9px,#000 10px);mask:radial-gradient(circle,transparent 9px,#000 10px)}
.wd.t{color:var(--ink)}.wd.t::after{content:"";width:4px;height:4px;border-radius:50%;background:#34c759;margin-top:-2px}
.hlb span{margin-left:6px;color:var(--ink)}
.sls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px 12px;border-radius:26px;text-align:center;transition:transform .35s cubic-bezier(.34,1.6,.5,1)}.sb:active{transform:scale(.94)}
.sb strong{font-size:16px}.sb small{font-size:12px;color:var(--mute)}
.sw{position:relative;width:76px;height:76px;border-radius:50%;overflow:hidden;margin-bottom:4px}
.sw.on::after{content:"";position:absolute;inset:-20%;background:linear-gradient(110deg,transparent 42%,rgba(255,255,255,.6) 50%,transparent 58%);transform:translateX(-130%);animation:shn 4.5s ease-in-out infinite;animation-delay:calc(var(--i,0)*.5s)}@keyframes shn{55%,100%{transform:translateX(130%)}}
.sl{display:block;width:100%;height:100%;overflow:visible}.sl .gl{filter:drop-shadow(0 1.5px 1px rgba(0,0,0,.28))}
.sl:not(.on) .sc{fill:var(--chipc);stroke:var(--line);stroke-width:2;stroke-dasharray:2 5}.sl:not(.on) .dt,.sl:not(.on) .dk{display:none}.sl:not(.on) .gl{stroke:var(--mute);opacity:.45;filter:none}
.nx .sw{animation:nxp 2.6s ease-in-out infinite}@keyframes nxp{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--a) 28%,transparent)}}
.hm svg.sl{width:24px;height:24px;flex:none}.hm span{gap:6px}
.sm{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(10,10,14,.45);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;pointer-events:none;transition:opacity .35s}.sm.on{opacity:1;pointer-events:auto}
.sc2{width:min(320px,100%);padding:28px 24px 22px;border-radius:36px;text-align:center;background:var(--glass);box-shadow:0 30px 70px -20px rgba(0,0,0,.5),inset 0 0 0 1px var(--line);transform:translateY(30px) scale(.9);transition:transform .6s cubic-bezier(.34,1.5,.5,1)}.sm.on .sc2{transform:none}
.sc2 .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sbig{width:168px;height:168px;margin:14px auto;perspective:600px}.sbig .sw{width:168px;height:168px}.sm.on .sbig .sw{animation:sp3 .9s cubic-bezier(.34,1.3,.5,1)}@keyframes sp3{from{transform:rotateY(-200deg) scale(.4);opacity:0}}
.sc2 h3{margin:0;font-size:30px;letter-spacing:-.02em}.sc2 p{margin:6px 0 18px;color:var(--mute);font-size:15px}.sc2 button{width:100%;height:50px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px}
/* ---- one-app polish ---- */
.bgo{position:fixed;inset:0;z-index:-1;overflow:hidden}.bgo i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;filter:blur(90px);opacity:.3;background:#ff8ab4;top:-35%;right:-40%;animation:fl 14s ease-in-out infinite alternate}.bgo i+i{background:#a5b4fc;top:auto;right:auto;bottom:-40%;left:-40%;animation-delay:-6s}@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.mo{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--mute);transition:background .25s}.mo:active{background:var(--chipc)}.mo svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-linecap:round;transition:transform .4s cubic-bezier(.34,1.5,.5,1)}.ex .mo svg{transform:rotate(90deg)}
.hm{min-height:50px;display:flex;flex-direction:column;justify-content:center}.hr:has(.ck:active){transform:scale(.985)}.hr{transition:transform .25s cubic-bezier(.34,1.6,.5,1)}
.sgs button{min-height:44px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ov{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:60;transform:translateY(105%);visibility:hidden;transition:transform .6s cubic-bezier(.32,.72,0,1),visibility 0s linear .6s}.ov.on{transform:none;visibility:visible;transition:transform .6s cubic-bezier(.32,.72,0,1),visibility 0s}
#st{transition:none}.pane{visibility:hidden;transition:opacity .3s,transform .45s cubic-bezier(.32,.72,0,1),visibility 0s linear .45s}.pane.on{visibility:visible;transition-delay:0s}.pane:not(.on) *{animation-play-state:paused!important}.bgo{display:none}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70vmax 60vmax at 100% 0,rgba(255,138,180,.24),transparent 70%),radial-gradient(70vmax 60vmax at 0 100%,rgba(165,180,252,.26),transparent 70%)}@media (prefers-color-scheme:dark){body::before{opacity:.4}}.hc{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}svg.ix{width:1.05em;height:1.05em;vertical-align:-.17em;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;margin-right:.3em}.ad svg.ix,.sw svg.ix,.x svg.ix,.btn svg.ix,button:not(.link):not(.btn2) svg.ix:only-child{margin:0}.chk svg.ix{width:52px;height:52px;stroke-width:3;margin:0;vertical-align:0}.ic svg{width:24px;height:24px}
</style></head><body>

 <iframe class="pane on" title="Today" id="f0"></iframe>

</div>

 <button data-a="2" style="--k:#f0518f"><i><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></i>Log a workout</button>
