<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --t: 0s;
    --df-window-bg: #A5B4FC;
    --df-card: #FFFBF5;
    --df-ink: #1E293B;
    --df-muted: #3F4668;
    --df-primary: #1C1917;
    --df-border: rgba(255,255,255,0.55);
    --cat-focus: #58A6FF;
    --cat-craft: #BC8CFF;
    --cat-fitness: #3FB950;
    --cat-recovery: #F0883E;
    --cat-hydration: #38BDF8;
    --spring: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1080px; height:1080px; overflow:hidden;
    background: var(--df-window-bg);
    font-family:'Nunito', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.011em;
  }
  body { color: var(--df-ink); display:flex; align-items:center; justify-content:center; }
  .stage { width:1080px; height:1080px; position:relative; padding:96px; }

  .caption-top {
    position:absolute; top:80px; left:0; right:0; text-align:center;
    font-size:30px; font-weight:600; letter-spacing:-0.015em;
    color: var(--df-ink);
    opacity:0; transform: translateY(6px);
    animation: capIn 0.7s var(--spring) 0.15s forwards;
    animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 0.15s);
  }
  @keyframes capIn { to { opacity:1; transform:translateY(0); } }

  .caption-sub {
    position:absolute; top:130px; left:0; right:0; text-align:center;
    font-size:20px; font-weight:500; letter-spacing:-0.01em;
    color: var(--df-muted);
    opacity:0; transform: translateY(4px);
    animation: capIn 0.7s var(--spring) 0.5s forwards;
    animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 0.5s);
  }

  /* glass cream panel — same recipe */
  .panel {
    width:760px; height:680px; margin-top:96px;
    background: rgba(255, 251, 245, 0.78);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    backdrop-filter: blur(24px) saturate(180%);
    border: 0.5px solid var(--df-border);
    border-radius: 24px;
    box-shadow:
      inset 0 0.5px 0 rgba(255,255,255,0.95),
      0 12px 32px -8px rgba(30, 27, 59, 0.18);
    overflow:hidden;
    position:relative;
    opacity:0; transform: translateY(10px) scale(0.998);
    animation: frameIn 0.7s var(--spring) 0.25s forwards;
    animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 0.25s);
  }
  @keyframes frameIn { to { opacity:1; transform:translateY(0) scale(1); } }

  .panel-head {
    padding: 20px 28px 12px;
    border-bottom: 0.5px solid rgba(30, 41, 59, 0.08);
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel-head .title { font-size:18px; font-weight:700; letter-spacing:-0.015em; }
  .panel-head .day   { font-size:14px; font-weight:600; color:var(--df-muted); }

  .habits {
    padding: 12px 28px;
    display:flex; flex-direction:column;
  }
  .habit-row {
    display:flex; align-items:center; gap:16px;
    padding: 16px 0;
    border-bottom: 0.5px solid rgba(30, 41, 59, 0.06);
    opacity:0; transform: translateY(6px);
  }
  .habit-row:last-child { border-bottom: none; }
  .habit-row .name {
    flex:0 0 200px;
    font-size:18px; font-weight:600; letter-spacing:-0.015em;
    display:flex; align-items:center; gap:8px;
  }
  .habit-row .swatch { width:10px; height:10px; border-radius:50%; }
  .habit-row .grid {
    flex:0 0 auto;
    display:flex; gap:6px;
  }
  .habit-row .day-dot {
    width:18px; height:18px; border-radius:50%;
    background: transparent;
    border:1.5px solid rgba(30,41,59,0.15);
  }
  .habit-row .day-dot.met { border-color: transparent; }
  /* flame + streak */
  .habit-row .streak {
    margin-left:auto;
    display:flex; align-items:center; gap:6px;
    font-weight:800; font-size:18px; letter-spacing:-0.01em;
  }
  .habit-row .flame {
    font-size: 22px;
    color: #F97316;
    filter: drop-shadow(0 0 4px rgba(249, 115, 22, 0.4));
  }
  .habit-row .streak-n {
    font-family:'JetBrains Mono', monospace;
    color: var(--df-ink);
  }

  .habit-row.h1 .swatch { background: var(--cat-fitness); }
  .habit-row.h2 .swatch { background: var(--cat-focus); }
  .habit-row.h3 .swatch { background: var(--cat-hydration); }
  .habit-row.h4 .swatch { background: var(--cat-recovery); }

  /* met dot colors per habit */
  .habit-row.h1 .day-dot.met { background: var(--cat-fitness); }
  .habit-row.h2 .day-dot.met { background: var(--cat-focus); }
  .habit-row.h3 .day-dot.met { background: var(--cat-hydration); }
  .habit-row.h4 .day-dot.met { background: var(--cat-recovery); }

  .habit-row.h1 { animation: rowIn 0.5s var(--spring) 0.7s forwards; animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 0.7s); }
  .habit-row.h2 { animation: rowIn 0.5s var(--spring) 0.95s forwards; animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 0.95s); }
  .habit-row.h3 { animation: rowIn 0.5s var(--spring) 1.2s forwards; animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 1.2s); }
  .habit-row.h4 { animation: rowIn 0.5s var(--spring) 1.45s forwards; animation-play-state:paused; animation-delay:calc(-1 * var(--t) + 1.45s); }
  @keyframes rowIn { to { opacity:1; transform: translateY(0); } }

  .mark {
    position:absolute; bottom:48px; right:48px;
    font-weight:800; font-size:22px; letter-spacing:-0.01em;
    color: var(--df-ink); opacity:0.35;
  }
  .mark .dot { color: var(--df-card); }
</style>
</head>
<body>
  <div class="stage">
    <div class="caption-top">Streaks. With flames.</div>
    <div class="caption-sub">(the flames are the point.)</div>
    <div class="panel">
      <div class="panel-head">
        <div class="title">Habits · this week</div>
        <div class="day">7-day grid</div>
      </div>
      <div class="habits">
        <!-- 7-day grid; dots fill left-to-right per row (5/7, 6/7, 7/7, 4/7) -->
        <div class="habit-row h1">
          <div class="name"><span class="swatch"></span> Movement</div>
          <div class="grid">
            <span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot"></span><span class="day-dot"></span>
          </div>
          <div class="streak"><span class="flame">🔥</span><span class="streak-n">5d</span></div>
        </div>
        <div class="habit-row h2">
          <div class="name"><span class="swatch"></span> Work focus</div>
          <div class="grid">
            <span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot"></span>
          </div>
          <div class="streak"><span class="flame">🔥</span><span class="streak-n">6d</span></div>
        </div>
        <div class="habit-row h3">
          <div class="name"><span class="swatch"></span> Hydration</div>
          <div class="grid">
            <span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span>
          </div>
          <div class="streak"><span class="flame">🔥</span><span class="streak-n">12d</span></div>
        </div>
        <div class="habit-row h4">
          <div class="name"><span class="swatch"></span> Sleep</div>
          <div class="grid">
            <span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot met"></span><span class="day-dot"></span><span class="day-dot"></span><span class="day-dot"></span><span class="day-dot"></span>
          </div>
          <div class="streak"><span class="flame">🔥</span><span class="streak-n">3d</span></div>
        </div>
      </div>
    </div>
    <div class="mark">focus triad<span class="dot">.</span></div>
  </div>
</body>
</html>
