<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --t: 0s;
    /* Source-faithful tokens — pulled verbatim from dayflow-web theme.css */
    --df-window-bg: #A5B4FC;        /* periwinkle light window */
    --df-card: #FFFBF5;             /* cream card */
    --df-ink: #1E293B;              /* slate-800 foreground */
    --df-muted: #3F4668;            /* muted-foreground */
    --df-primary: #1C1917;          /* charcoal CTA / punchline bg */
    --df-border: rgba(255,255,255,0.55);
    --cat-focus: #58A6FF;           /* work */
    --cat-craft: #BC8CFF;           /* personal */
    --cat-fitness: #3FB950;         /* movement */
    --cat-recovery: #F0883E;        /* sleep */
    --cat-hydration: #38BDF8;       /* water */
    --spring: cubic-bezier(0.32, 0.72, 0, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:1080px; height:1080px; overflow:hidden;
    background: var(--df-primary);  /* charcoal for hook scene */
    font-family: 'Nunito', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-optical-sizing: auto;
    text-rendering: optimizeLegibility;
    letter-spacing: -0.011em;
  }
  body { color: var(--df-card); display:flex; align-items:center; justify-content:center; }
  .stage { width:1080px; height:1080px; position:relative; }

  /* "you have a day." — fades up after 0.6s, settles, holds */
  .hook {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-weight: 500;
    font-size: 76px;
    letter-spacing: -0.02em;
    color: var(--df-card);
    opacity: 0;
    transform: translateY(8px);
    animation: fadeUp 1.4s var(--spring) forwards;
    animation-play-state: paused;
    animation-delay: calc(-1 * var(--t, 0s));
  }
  @keyframes fadeUp {
    0%   { opacity: 0; transform: translateY(8px); }
    43%  { opacity: 1; transform: translateY(0); }   /* settled by ~0.6+0.6=1.2s */
    100% { opacity: 1; transform: translateY(0); }
  }

  /* tiny corner mark — brand presence on every frame */
  .mark {
    position:absolute; bottom:48px; right:48px;
    font-family:'Nunito', sans-serif; font-weight:800; font-size:22px;
    letter-spacing:-0.01em;
    color: var(--df-card);
    opacity:0.0;
    animation: markIn 0.8s ease-out 0.4s forwards;
    animation-play-state: paused;
    animation-delay: calc(-1 * var(--t, 0s) + 0.4s);
  }
  .mark .dot { color: var(--df-window-bg); }   /* periwinkle period for contrast */
  @keyframes markIn { to { opacity: 0.45; } }
</style>
</head>
<body>
  <div class="stage">
    <div class="hook">you have a day.</div>
    <div class="mark">focus triad<span class="dot">.</span></div>
  </div>
</body>
</html>
